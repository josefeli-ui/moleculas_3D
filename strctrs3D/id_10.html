<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Molécula 3D – id10.sdf</title>

    <!-- Cargar la librería 3Dmol.js -->
    <script src="https://3Dmol.org/build/3Dmol.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.4em;
        }
        #viewer {
            width: 100%;
            height: 600px;
            background: #eaeaea;
        }
        .info {
            padding: 20px;
            text-align: center;
            color: #333;
        }
    </style>
</head>

<body>

<header>
    Visualización 3D de la molécula id10.sdf
</header>

<div id="viewer"></div>

<div class="info">
    Archivo cargado desde:<br>
    <code>https://josefeli-ui.github.io/moleculas_3D/strctrs3D/data/id10.sdf</code>
</div>

<script>
    // Crear el visor dentro del div #viewer
    let viewer = $3Dmol.createViewer("viewer", {
        backgroundColor: "white"
    });

    // Cargar tu archivo local desde GitHub Pages
    $3Dmol.download("https://josefeli-ui.github.io/moleculas_3D/strctrs3D/data/id10.sdf", viewer, {}, function() {
        viewer.setStyle({}, {stick: {radius: 0.15}});
        viewer.zoomTo();
        viewer.render();
    });
</script>

</body>
</html>
