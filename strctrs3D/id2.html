<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación – Iframe</title>

    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: 2px solid #38bdf8;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Inserta aquí tu iframe -->
        <iframe 
            src="https://embed.molview.org/v1/?mode=balls&amp;cid=23616462"
            allowfullscreen>
        </iframe>

    </div>
</body>
</html>
